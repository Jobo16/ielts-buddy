name: Release Skill

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/sync_shared.py --check
      - run: python3 scripts/validate_skills.py
      - run: python3 -m unittest discover -s tests
      - name: Verify deployed public API contract
        run: |
          python3 scripts/check_contract.py --live
          python3 scripts/check_contract.py --live --url https://ieltsbuddy.igopx.cn/api/public/developer-api/catalog.json
      - name: Verify tag
        run: test "${GITHUB_REF_NAME}" = "v$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
      - name: Build GitHub release assets
        run: python3 scripts/release_distribution.py build --ci --output-dir .release-dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          notes_args=(--generate-notes)
          if [[ -f "$notes" ]]; then
            notes_args=(--notes-file "$notes")
          fi
          gh release create "$GITHUB_REF_NAME" \
            .release-dist/latest.json .release-dist/ielts-buddy-agent-skills.zip .release-dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest --title "$GITHUB_REF_NAME" "${notes_args[@]}"
