name: Validate Skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/sync_shared.py --check
      - run: python3 scripts/validate_skills.py
      - run: python3 scripts/check_contract.py
      - run: python3 -m unittest discover -s tests
