interface:
  display_name: "IELTS 学习计划"
  short_description: "诊断、跨技能闭环、每日学习与周复盘"
  default_prompt: "使用 $ielts-study-plan 把我刚完成的练习结果转成今天一个明确的训练动作。"
dependencies:
  tools:
    - type: "mcp"
      value: "ielts-buddy-public"
      description: "无需 OAuth 的 IELTS Buddy 已发布预测命中与知识资料"
      transport: "streamable_http"
      url: "https://ieltsbuddy.igopx.cn/mcp/public"
    - type: "mcp"
      value: "ielts-buddy"
      description: "IELTS Buddy 题库、课程、词汇、进度和学习记录数据服务"
      transport: "streamable_http"
      url: "https://ieltsbuddy.igocn.cn/mcp"
